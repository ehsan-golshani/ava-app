<style>
/* Ava single-file styles — dark/light via CSS vars, RTL */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #fc3c44;
  --bg: #000;
  --card: #131315;
  --fill: rgba(255,255,255,.10);
  --fill-weak: rgba(255,255,255,.05);
  --fill-strong: rgba(255,255,255,.18);
  --line: rgba(255,255,255,.09);
  --line-weak: rgba(255,255,255,.05);
  --fg: #f5f5f7;
  --fg-mid: #c9c9cf;
  --fg-sub: #98989f;
  --fg-dim: #8e8e93;
  --fg-faint: #48484a;
  --err-tx: #ffb4a9;
  --glass: rgba(16,16,18,.82);
  --glassbg: rgba(0,0,0,.8);
  --player-bottom: #000;
  --spin-ring: rgba(255,255,255,.25);
}
html[data-theme="light"] {
  --bg: #f2f2f7;
  --card: #fff;
  --fill: rgba(120,120,128,.16);
  --fill-weak: rgba(120,120,128,.09);
  --fill-strong: rgba(120,120,128,.24);
  --line: rgba(0,0,0,.12);
  --line-weak: rgba(0,0,0,.06);
  --fg: #17171c;
  --fg-mid: #48484e;
  --fg-sub: #6a6a70;
  --fg-dim: #85858b;
  --fg-faint: #c3c3c9;
  --err-tx: #c03227;
  --glass: rgba(250,250,253,.88);
  --glassbg: rgba(242,242,247,.86);
  --player-bottom: #f2f2f7;
  --spin-ring: rgba(0,0,0,.18);
}
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: Vazirmatn, -apple-system, "Segoe UI", Tahoma, sans-serif;
  overscroll-behavior-y: none;
  touch-action: manipulation;
  direction: rtl;
  overflow: hidden;
}
button { background: none; border: 0; color: inherit; font-family: inherit; cursor: pointer; }
input { font-family: inherit; border: 0; outline: none; background: transparent; color: var(--fg); }
svg { display: block; }

#app { position: relative; max-width: 448px; margin: 0 auto; height: 100dvh; overflow: hidden; }
#main {
  position: absolute; inset: 0; overflow-y: auto; padding: 0 14px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 150px;
  scrollbar-width: none;
}
#main::-webkit-scrollbar { display: none; }
.view { display: none; }
.view.active { display: block; animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.bigtitle { font-size: 30px; font-weight: 700; line-height: 1.2; padding: 8px 4px 12px; }
.px1 { padding-right: 4px; }
.bigtitle-line { display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 4px 12px; }
.bigtitle-line .bigtitle { padding: 0; }
.tt-actions { display: flex; gap: 2px; }

.iconbtn { display: flex; align-items: center; justify-content: center; height: 40px; width: 40px; border-radius: 999px; color: var(--fg); transition: transform .1s; }
.iconbtn:active { transform: scale(.9); }
.iconbtn.acc { color: var(--primary); }
.iconbtn.dim { color: var(--fg-dim); }
.flex1 { flex: 1; min-width: 0; }
.ta-r { text-align: right; }

.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--fill); color: var(--fg); border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600; }
.pill:active { background: var(--fill-strong); }
.pill.sm { padding: 7px 14px; font-size: 12px; }
.pill.danger { color: #ff453a; background: rgba(255,69,58,.12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }

/* add card */
.addcard {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: right;
  border: 1px solid var(--line); border-radius: 24px; padding: 16px; margin-bottom: 16px;
  background: linear-gradient(to left, rgba(252,60,68,.13), rgba(252,60,68,.03));
  transition: transform .1s;
}
.addcard:active { transform: scale(.98); }
.addcard-ic { display: flex; height: 48px; width: 48px; align-items: center; justify-content: center; border-radius: 16px; background: var(--primary); color: #fff; box-shadow: 0 8px 24px rgba(252,60,68,.45); flex-shrink: 0; }
.addcard-t { display: block; font-size: 15px; font-weight: 700; color: var(--fg); }
.addcard-d { display: block; margin-top: 2px; font-size: 12px; line-height: 1.5; color: var(--fg-sub); }

/* import bar */
.import-bar { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--fill-weak); border-radius: 16px; padding: 14px; margin-bottom: 12px; font-size: 13px; }
.mini-prog { height: 6px; width: 64px; border-radius: 999px; background: var(--fill-strong); overflow: hidden; }
.mini-prog > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width .2s; }
.spin-note { color: var(--primary); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sec-title { font-size: 19px; font-weight: 700; padding: 10px 4px 6px; }

/* track rows */
.trow { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 8px; transition: background .15s; }
.trow:active { background: var(--fill); }
.row-main { flex: 1; min-width: 0; }
.row-title-line { display: flex; align-items: center; gap: 6px; }
.row-title { font-size: 15px; font-weight: 500; line-height: 1.6; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title.act { color: var(--primary); }
.row-sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-sub); overflow: hidden; }
.row-sub > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-kic { height: 12px; width: 12px; flex-shrink: 0; }
.row-dot { opacity: .5; }
.row-menu { display: flex; height: 36px; width: 36px; align-items: center; justify-content: center; border-radius: 999px; color: var(--fg-dim); flex-shrink: 0; }

/* artwork */
.art { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.7); flex-shrink: 0; overflow: hidden; }
.art-48 { height: 48px; width: 48px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.art-44 { height: 44px; width: 44px; border-radius: 14px; }
.art-40 { height: 40px; width: 40px; border-radius: 10px; }
.art-ic { height: 20px; width: 20px; }
.art-ic-20 { height: 20px; width: 20px; }
.art-ic-18 { height: 18px; width: 18px; }
.art-ic-16 { height: 16px; width: 16px; }

/* eq bars */
.eq { display: flex; align-items: flex-end; gap: 2px; height: 15px; padding-bottom: 2px; flex-shrink: 0; }
.eq i { display: block; width: 3px; border-radius: 2px; background: var(--primary); animation-duration: .9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
@keyframes eq1 { 0%,100% { height: 30%; } 50% { height: 100%; } }
@keyframes eq2 { 0%,100% { height: 90%; } 50% { height: 35%; } }
@keyframes eq3 { 0%,100% { height: 55%; } 50% { height: 95%; } }

/* empty + hints */
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 48px 24px; text-align: center; }
.empty-ic { display: flex; height: 64px; width: 64px; align-items: center; justify-content: center; border-radius: 24px; background: var(--fill-weak); color: var(--fg-faint); }
.empty-t { font-size: 15px; font-weight: 600; color: var(--fg-mid); }
.empty-d { max-width: 270px; font-size: 12.5px; line-height: 1.6; color: var(--fg-sub); }
.hint-center { padding: 36px 16px; text-align: center; font-size: 13px; line-height: 1.7; color: var(--fg-sub); }
.err-tx { color: var(--err-tx); }

/* sticky + searchbar + segmented */
.sticky-wrap { position: sticky; top: 0; z-index: 20; margin: 0 -14px; padding: 2px 14px 8px; background: var(--glassbg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.sticky-sub { position: sticky; top: 46px; z-index: 15; margin: 0 -2px; padding: 2px 2px 8px; background: var(--glassbg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.searchbar { display: flex; align-items: center; gap: 10px; height: 46px; border-radius: 16px; background: var(--fill); padding: 0 14px; }
.searchbar input { flex: 1; height: 100%; font-size: 14.5px; }
.searchbar input::placeholder { color: var(--fg-dim); text-align: right; }
.searchbar input[dir="ltr"] { text-align: left; direction: ltr; }
.dim { color: var(--fg-dim); display: flex; }
.segbar { display: flex; background: var(--fill-weak); border-radius: 16px; padding: 4px; }
.seg { flex: 1; height: 36px; border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--fg-sub); transition: background .15s, color .15s; }
.seg.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.segrow { display: flex; gap: 6px; padding: 12px; }
.seg.big { height: 44px; border-radius: 16px; background: var(--fill); color: var(--fg); }
.seg.big.on { background: var(--primary); color: #fff; }

/* cards */
.card { border: 1px solid var(--line); background: var(--card); border-radius: 24px; overflow: hidden; margin-bottom: 10px; }
.card.p-3 > .segrow { padding: 12px; }
.row-card { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px; width: auto; }
.row-card.w-full { width: 100%; text-align: right; }
.row-card:active { background: var(--fill-weak); }
.row-t { display: block; font-size: 15px; font-weight: 700; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-s { display: block; font-size: 11.5px; color: var(--fg-sub); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip { border: 1px solid var(--line-weak); background: var(--fill-weak); color: var(--fg-sub); border-radius: 16px; padding: 14px; font-size: 11.5px; line-height: 1.7; margin-bottom: 10px; }
.arch-ic { display: flex; height: 40px; width: 40px; align-items: center; justify-content: center; border-radius: 12px; background: var(--fill); color: var(--fg-sub); flex-shrink: 0; }

/* source cards */
.src-card { margin-bottom: 10px; }
.src-head { display: flex; align-items: center; gap: 12px; padding: 14px; }
.src-actions { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line-weak); padding: 8px 14px; }
.src-actions .pill.sm { display: inline-flex; }
.scan-prog { height: 4px; margin: 0 14px 8px; border-radius: 999px; background: var(--fill); overflow: hidden; }
.scan-prog > div { height: 100%; background: var(--primary); border-radius: 999px; transition: width .5s; }
.scan-info { padding: 0 14px 10px; font-size: 11.5px; color: var(--fg-sub); }
.scan-err { margin: 0 14px 10px; border-radius: 16px; background: rgba(255,69,58,.08); color: var(--err-tx); padding: 12px; font-size: 12px; line-height: 1.6; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.src-card .trow { padding: 6px 10px; }
.addbar { padding-right: 5px; }
.fab { display: flex; height: 36px; width: 36px; align-items: center; justify-content: center; border-radius: 999px; color: #fff; flex-shrink: 0; transition: transform .1s; }
.fab:active { transform: scale(.88); }
.arch-play { margin: 0 0 8px auto; }
.spin-wrap { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 30px; color: var(--fg-sub); font-size: 13px; }
.spinner { display: block; height: 26px; width: 26px; border-radius: 999px; border: 3px solid var(--spin-ring, rgba(255,255,255,.25)); border-top-color: var(--fg); animation: spin 1s linear infinite; }
.acc-b { background: var(--primary) !important; color: #fff !important; box-shadow: 0 6px 18px rgba(252,60,68,.4); }

/* settings */
.install-card { border: 1px solid var(--line); background: linear-gradient(rgba(252,60,68,.15), var(--card)); border-radius: 24px; padding: 20px; text-align: center; margin-bottom: 20px; }
.install-ic { display: flex; height: 56px; width: 56px; align-items: center; justify-content: center; margin: 0 auto 12px; border-radius: 20px; background: var(--primary); color: #fff; box-shadow: 0 10px 28px rgba(252,60,68,.5); }
.install-t { font-size: 17px; font-weight: 700; color: var(--fg); }
.install-d { margin: 6px auto 0; max-width: 290px; font-size: 12.5px; line-height: 1.6; color: var(--fg-mid); }
.install-btn { margin-top: 16px; border-radius: 999px; background: var(--primary); color: #fff; padding: 12px 32px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 22px rgba(252,60,68,.4); }
.install-how { margin-top: 16px; border-radius: 16px; background: var(--fill-weak); padding: 12px 16px; text-align: right; font-size: 12px; line-height: 1.9; color: var(--fg-sub); }
.install-how b { color: var(--fg); }
.group-t { padding: 2px 8px 6px; font-size: 12px; font-weight: 600; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .02em; }
.set-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-weak); }
.set-row:last-child { border-bottom: 0; }
.set-t { font-size: 14px; font-weight: 600; line-height: 1.6; color: var(--fg); }
.set-d { margin-top: 2px; font-size: 12px; line-height: 1.65; color: var(--fg-sub); }

/* tab bar */
#tabbar {
  position: absolute; inset-inline: 0; bottom: 0; z-index: 30;
  display: flex; height: calc(54px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  border-top: 1px solid var(--line);
  background: var(--glass); backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8);
}
.tabbtn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--fg-dim); font-size: 10px; transition: transform .1s; }
.tabbtn:active { transform: scale(.9); }
.tabbtn.on { color: var(--primary); }
.tabbtn svg { height: 22px; width: 22px; }

/* mini player */
#mini {
  position: absolute; inset-inline: 12px; z-index: 20;
  bottom: calc(54px + env(safe-area-inset-bottom, 0px) + 10px);
  display: none; align-items: center; gap: 10px; height: 56px;
  border-radius: 16px; border: 1px solid var(--line);
  background: var(--glass); backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8);
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  overflow: hidden; padding: 0 6px 0 8px;
  direction: rtl;
}
html[dir="rtl"] #mini { padding: 0 8px 0 6px; }
#mini.show { display: flex; }
.mini-prog-top { position: absolute; top: 0; inset-inline: 0; height: 2px; background: var(--fill); }
.mini-prog-top > div { height: 100%; background: var(--primary); transition: width .2s; }
.mini-t { font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-s { font-size: 11px; line-height: 1.4; color: var(--fg-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* player sheet */
#sheet {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  transform: translateY(100%);
  transition: transform .34s cubic-bezier(.32,.72,.28,1);
  visibility: hidden;
}
#sheet.open { transform: translateY(0); visibility: visible; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; flex-shrink: 0; }
.sheet-src { font-size: 11px; font-weight: 500; color: var(--fg-mid); opacity: .8; }
#sheet-art { margin: 8px auto 0; width: 78%; max-width: 340px; aspect-ratio: 1; flex-shrink: 0; touch-action: pan-y; }
.art-full { width: 100%; height: 100%; border-radius: 28px; box-shadow: 0 24px 64px rgba(0,0,0,.45); }
.art-full .art { width: 100%; height: 100%; border-radius: 28px; }
#sheet-art .art { width: 100%; height: 100%; border-radius: 28px; }
#sheet-art .art svg { height: 64px; width: 64px; color: rgba(255,255,255,.75); }
.sheet-titles { margin-top: 22px; padding: 0 28px; }
.sheet-title { font-size: 21px; font-weight: 700; line-height: 1.5; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-artist { margin-top: 2px; font-size: 16px; line-height: 1.5; color: var(--fg); opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* sliders */
.sl { position: relative; display: flex; align-items: center; height: 28px; touch-action: none; direction: ltr; }
.sl-track { height: 5px; width: 100%; border-radius: 999px; background: var(--fill-strong); overflow: hidden; }
.sl-fill { height: 100%; border-radius: 999px; background: var(--slider-fill, rgba(255,255,255,.92)); transition: width .075s linear; }
html[data-theme="light"] .sl-fill { --slider-fill: rgba(23,23,28,.85); background: var(--slider-fill, rgba(23,23,28,.85)); }
.sl-thumb { position: absolute; top: 50%; height: 14px; width: 14px; border-radius: 999px; background: var(--fg); transform: translate(-50%, -50%); box-shadow: 0 2px 6px rgba(0,0,0,.35); opacity: .88; }
.seek-wrap { margin-top: 16px; padding: 0 28px; }
.times { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg); opacity: .45; font-variant-numeric: tabular-nums; direction: ltr; }

/* transport */
.transport { display: flex; align-items: center; justify-content: center; gap: 36px; margin-top: 4px; padding: 0 32px; direction: ltr; flex-shrink: 0; }
.tbtn { display: flex; height: 56px; width: 56px; align-items: center; justify-content: center; color: var(--fg); transition: transform .1s; }
.tbtn:active { transform: scale(.88); }
.tbtn svg { height: 36px; width: 36px; }
#btn-play { height: 74px; width: 74px; border-radius: 999px; background: var(--fill-weak); backdrop-filter: blur(8px); }
#btn-play svg { height: 46px; width: 46px; margin-left: 4px; }
#btn-play .spinner { margin: 0 auto; }
.pl-ic { color: var(--fg); }
.vol-wrap { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 0 32px; direction: ltr; }
.vol-lab { font-size: 11px; color: var(--fg); opacity: .45; width: 14px; text-align: center; }
.sheet-foot { margin-top: auto; padding: 16px 0 calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; align-items: center; justify-content: center; gap: 56px; }
.foot-btn { display: flex; height: 44px; width: 44px; align-items: center; justify-content: center; border-radius: 999px; color: var(--fg-dim); }
.foot-btn svg { height: 22px; width: 22px; }

/* menu sheet */
#menubackdrop { position: absolute; inset: 0; z-index: 49; background: rgba(0,0,0,.55); display: none; }
#menubackdrop.open { display: block; animation: fadein .2s; }
#menusheet {
  position: absolute; inset-inline: 8px; z-index: 50;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
  border-radius: 24px; border: 1px solid var(--line);
  background: var(--glass); backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8);
  padding-bottom: 8px; display: none;
  transform: translateY(30px); opacity: 0;
  transition: transform .28s cubic-bezier(.32,.72,.28,1), opacity .2s;
}
#menusheet.open { display: block; transform: none; opacity: 1; }
.menu-head { display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px; }
.menu-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; border-radius: 16px; padding: 12px; font-size: 15px; color: var(--fg); }
.menu-row:active { background: var(--fill); }
.menu-row.danger { color: #ff453a; }
.menu-row svg { flex-shrink: 0; }

/* toast */
#toast {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); inset-inline: 24px; z-index: 60;
  display: flex; justify-content: center; pointer-events: none;
  opacity: 0; transform: translateY(-12px); transition: all .22s;
}
#toast.show { opacity: 1; transform: none; }
#toast > * { }
#toast.show { }
#toast::after { }
#toast {
  color: var(--fg); font-size: 13px;
  background: var(--glass); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  max-width: calc(100% - 48px); text-align: center; line-height: 1.5;
}
#toast.error { color: var(--err-tx); }

.hidden-input { display: none; }
.rot { transform: rotate(180deg); }
.iconbtn svg, .pill svg { pointer-events: none; }

/* icon size utilities (no tailwind in single-file build) */
.h-3\.5 { height: 14px; width: 14px; }
.w-3\.5 { height: 14px; width: 14px; }
.h-4 { height: 16px; width: 16px; }
.w-4 { height: 16px; width: 16px; }
.h-4\.5 { height: 18px; width: 18px; }
.w-4\.5 { height: 18px; width: 18px; }
.h-5 { height: 20px; width: 20px; }
.w-5 { height: 20px; width: 20px; }
.h-6 { height: 24px; width: 24px; }
.w-6 { height: 24px; width: 24px; }
.h-7 { height: 28px; width: 28px; }
.w-7 { height: 28px; width: 28px; }
.h-8 { height: 32px; width: 32px; }
.w-8 { height: 32px; width: 32px; }
.arch-head { display: flex; align-items: center; gap: 8px; padding: 6px 2px 10px; }

</style>
</head>
<body>

<script>
/* Ava single-file core: utils, IndexedDB, gradients, audio engine with Media Session */
"use strict";

/* ---------- tiny utils ---------- */
const AUDIO_EXT_RE = /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|webm)(\?|#|$)/i;
const FA_DIGITS = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
const toFa = (n) => String(n).replace(/\d/g, (d) => FA_DIGITS[Number(d)]);
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

function hashString(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function uid(p) {
  return (p || "id") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
}
function fmtTime(sec) {
  if (sec === undefined || !isFinite(sec) || sec < 0) return "--:--";
  const s = Math.floor(sec % 60), m = Math.floor((sec / 60) % 60), h = Math.floor(sec / 3600);
  const t = h > 0 ? h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") : m + ":" + String(s).padStart(2, "0");
  return toFa(t);
}
function fmtBytes(b) {
  if (b < 1024) return toFa(b) + " بایت";
  if (b < 1048576) return toFa((b / 1024).toFixed(0)) + " کیلوبایت";
  if (b < 1073741824) return toFa((b / 1048576).toFixed(1)) + " مگابایت";
  return toFa((b / 1073741824).toFixed(2)) + " گیگابایت";
}
function fmtRelTime(ts) {
  if (!ts) return "—";
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return "همین حالا";
  if (min < 60) return toFa(min) + " دقیقه پیش";
  if (min < 1440) return toFa(Math.floor(min / 60)) + " ساعت پیش";
  return toFa(Math.floor(min / 1440)) + " روز پیش";
}
function normFa(s) {
  return String(s || "")
    .replace(/[يى]/g, "ی").replace(/[ك]/g, "ک").replace(/[ۀة]/g, "ه").replace(/[أإآ]/g, "ا")
    .replace(/[\u200c\u064b-\u0652]/g, "").toLowerCase().trim();
}
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function parseFileName(name) {
  const base = name.replace(/\.[^.]+$/, "").replace(/_/g, " ").trim();
  const m = base.match(/^(.{2,60}?)\s*[-–—]\s*(.{2,})$/);
  return m ? { title: m[2].trim(), artist: m[1].trim() } : { title: base || name, artist: "" };
}
function parseSiteTitle(raw) {
  let t = String(raw || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(/^\s*(دانلود|Download)\s*/i, "")
    .replace(/\s*[+|]\s*(موزیک ویدیو|ورژن پیانو|با پیانو|کیفیت اصلی|لینک مستقیم)\s*/g, " ")
    .replace(/\s*(با لینک مستقیم|کیفیت ۳۲۰|کیفیت 128|mp3|320)\s*/gi, " ")
    .replace(/\s+/g, " ").trim();
  const m = t.match(/^(?:(?:آهنگ|اهنگ|مداحی|آلبوم|البوم|ریمیکس|پادکست|موسیقی متن|موسیقی)\s+)?(.+?)\s+از\s+(.+)$/);
  if (m && m[1].length >= 2 && m[2].length >= 2) return { title: m[1].trim(), artist: m[2].trim() };
  return { title: t || "بدون عنوان", artist: "" };
}
function normalizeUrl(input) {
  let u = String(input || "").trim();
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}
function hostOf(url) {
  try { return new URL(url).host.replace(/^www\./, ""); } catch (e) { return String(url || "").slice(0, 30); }
}
function isRssUrl(url) {
  const u = url.toLowerCase();
  return u.endsWith(".xml") || u.includes("rss") || u.includes("/feed") || u.includes("feeds.") || u.includes("format=xml");
}
function mimeFromUrl(url) {
  const m = url.match(/\.([a-z0-9]+)(\?|#|$)/i);
  const M = { mp3: "audio/mpeg", m4a: "audio/mp4", aac: "audio/aac", ogg: "audio/ogg", oga: "audio/ogg", opus: "audio/ogg", wav: "audio/wav", flac: "audio/flac" };
  return m && M[m[1].toLowerCase()] ? M[m[1].toLowerCase()] : "audio/mpeg";
}
function qualityFromUrl(url) {
  const m = url.match(/\b(320|256|192|128|64)\b/);
  return m ? m[1] : undefined;
}
function absUrl(base, u) {
  if (!u) return null;
  try {
    const url = new URL(u, base);
    if (url.protocol !== "http:" && url.protocol !== "https:") return null;
    return url.href;
  } catch (e) { return null; }
}

/* ---------- IndexedDB ---------- */
const DB_NAME = "ava-single-db";
let _db = null;
function openDb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("files")) db.createObjectStore("files");
      if (!db.objectStoreNames.contains("blobs")) db.createObjectStore("blobs");
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}
function idbGet(store, key) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const r = db.transaction(store, "readonly").objectStore(store).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  }));
}
function idbPut(store, key, val) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const r = db.transaction(store, "readwrite").objectStore(store).put(val, key);
    r.onsuccess = () => resolve(true);
    r.onerror = () => reject(r.error);
  }));
}
function idbDel(store, key) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const r = db.transaction(store, "readwrite").objectStore(store).delete(key);
    r.onsuccess = () => resolve(true);
    r.onerror = () => reject(r.error);
  }));
}
const kvGet = (k) => idbGet("kv", k).catch(() => undefined);
const kvPut = (k, v) => idbPut("kv", k, v).catch(() => false);

/* ---------- gradients + generated artwork ---------- */
const gradCache = new Map(), artCache = new Map();
function gradientFor(track) {
  let g = gradCache.get(track.key);
  if (g) return g;
  const h1 = track.hue != null ? track.hue : hashString(track.key) % 360;
  const h2 = (h1 + 50 + (hashString(track.key) % 60)) % 360;
  const s = 62 + (hashString(track.key) % 22);
  g = { h1: h1, h2: h2, s: s, css: "linear-gradient(135deg, hsl(" + h1 + " " + s + "% 46%) 0%, hsl(" + h2 + " " + s + "% 26%) 100%)" };
  gradCache.set(track.key, g);
  return g;
}
function artworkFor(track) {
  if (track.artworkUrl) return track.artworkUrl;
  let u = artCache.get(track.key);
  if (u) return u;
  try {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    const ctx = c.getContext("2d");
    const g = gradientFor(track);
    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, "hsl(" + g.h1 + " " + g.s + "% 46%)");
    grad.addColorStop(1, "hsl(" + g.h2 + " " + g.s + "% 24%)");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 512);
    const rg = ctx.createRadialGradient(380, 120, 10, 380, 120, 320);
    rg.addColorStop(0, "rgba(255,255,255,0.18)"); rg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = rg; ctx.fillRect(0, 0, 512, 512);
    const letter = (track.title || "آ").trim().charAt(0);
    ctx.font = "700 300px Vazirmatn, Tahoma, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText(letter, 256, 276);
    u = c.toDataURL("image/png");
    artCache.set(track.key, u);
    return u;
  } catch (e) { return ""; }
}

/* ---------- global state ---------- */
const S = {
  tab: "library",
  seg: "sources",
  localTracks: [],
  downloads: [],
  sources: [],
  onlineTracks: {},
  scans: {},
  importing: null,
  queue: [], index: -1,
  isPlaying: false, currentTime: 0, duration: 0, buffering: false,
  repeat: "all", shuffle: false, volume: 1,
  error: null,
  searchQ: "",
  installEvt: null,
  toast: null,
  menuTrack: null,
  archive: { phase: "idle", q: "", items: [], tracks: [], error: "" },
  expandedSource: null,
};

let toastTimer = null;
function showToast(msg, kind) {
  S.toast = { id: Date.now(), msg: msg, kind: kind || "info" };
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, 3400);
  renderToast();
}

/* ---------- audio engine ---------- */
const RESTART_THRESHOLD = 5;
const objectUrls = new Map();
const proxiedTried = new Set();
let failStreak = 0;
let pendingPlay = false;
const audio = new Audio();
audio.preload = "metadata";

function objectUrlFor(key, blobOrFile) {
  if (objectUrls.has(key)) return objectUrls.get(key);
  const u = URL.createObjectURL(blobOrFile);
  objectUrls.set(key, u);
  return u;
}

audio.addEventListener("timeupdate", () => {
  S.currentTime = audio.currentTime;
  updatePositionState();
  updatePlayerTimes();
});
audio.addEventListener("loadedmetadata", () => {
  S.duration = isFinite(audio.duration) ? audio.duration : 0;
  S.error = null;
  const t = S.queue[S.index];
  if (t && S.duration > 0 && !t.duration) {
    t.duration = S.duration;
    kvPut("queue", { queue: S.queue, index: S.index });
    renderMini(); renderPlayer();
  }
  if (pendingPlay) { pendingPlay = false; audio.play().catch(function(){}); }
  updatePlayerTimes();
});
audio.addEventListener("waiting", () => { S.buffering = true; renderMini(); renderPlayer(); });
audio.addEventListener("playing", () => {
  failStreak = 0;
  S.isPlaying = true; S.buffering = false;
  renderMini(); renderPlayer(); renderRowsState();
});
audio.addEventListener("pause", () => {
  if (!audio.src || audio.ended) return;
  S.isPlaying = false;
  renderMini(); renderPlayer(); renderRowsState();
});
audio.addEventListener("ended", () => next(true));
audio.addEventListener("error", () => onError());

async function resolveSrc(track) {
  try {
    const rec = await idbGet("blobs", track.key);
    if (rec && rec.blob) return objectUrlFor(track.key, rec.blob);
  } catch (e) {}
  if (track.kind === "local" && track.fileName) {
    try {
      const rec = await idbGet("files", track.fileName);
      if (rec && rec.file) return objectUrlFor(track.key, rec.file);
    } catch (e) {}
  }
  return track.url || null;
}

async function playQueue(tracks, startIndex) {
  if (!tracks || !tracks.length) return;
  S.queue = tracks.slice();
  S.index = startIndex || 0;
  S.currentTime = 0; S.duration = 0; S.error = null;
  kvPut("queue", { queue: S.queue, index: S.index });
  await playIndex(S.index);
}

async function playIndex(i) {
  if (i < 0 || i >= S.queue.length) return;
  S.index = i;
  S.currentTime = 0; S.duration = 0; S.error = null; S.buffering = true;
  kvPut("queue", { queue: S.queue, index: S.index });
  const track = S.queue[i];
  renderMini(); renderPlayer(); renderRowsState();
  const src = await resolveSrc(track);
  if (!src) {
    S.buffering = false; S.error = "فایل در دسترس نیست: " + track.title;
    renderPlayer(); return;
  }
  pendingPlay = true;
  audio.src = src;
  updateMediaSession(track);
  audio.play().catch(() => { pendingPlay = false; S.isPlaying = false; S.buffering = false; renderMini(); renderPlayer(); });
  if (track.duration) { S.duration = track.duration; updatePlayerTimes(); }
}

function toggle() {
  if (S.index < 0 || !audio.currentSrc) {
    if (S.queue.length > 0) playIndex(Math.max(0, S.index));
    return;
  }
  if (audio.paused) audio.play().catch(function(){});
  else audio.pause();
}

function next(auto) {
  if (S.queue.length === 0) return;
  if (auto && S.repeat === "one") { audio.currentTime = 0; audio.play().catch(function(){}); return; }
  if (S.shuffle && S.queue.length > 1) {
    let r = S.index;
    while (r === S.index) r = Math.floor(Math.random() * S.queue.length);
    playIndex(r); return;
  }
  const n = S.index + 1;
  if (n < S.queue.length) playIndex(n);
  else if (S.repeat === "all" || !auto) playIndex(0);
  else { S.isPlaying = false; renderMini(); renderPlayer(); }
}

function prev() {
  if (S.queue.length === 0) return;
  if (S.index > 0) playIndex(S.index - 1);
  else { audio.currentTime = 0; audio.play().catch(function(){}); }
}

/* the user's volume-key rule, remapped: hold prev → restart; if within first 5s → previous track */
function prevHold() {
  if (S.queue.length === 0) return;
  if (audio.currentTime > RESTART_THRESHOLD) { audio.currentTime = 0; audio.play().catch(function(){}); }
  else prev();
}

function seekForward30() {
  if (isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration - 0.5, audio.currentTime + 30);
}
function seek(t) {
  if (isFinite(audio.duration)) {
    audio.currentTime = Math.max(0, Math.min(audio.duration - 0.2, t));
    S.currentTime = audio.currentTime;
    updatePlayerTimes();
  }
}
function setVolume(v) {
  S.volume = v; audio.volume = v;
  kvPut("settings", { repeat: S.repeat, shuffle: S.shuffle, volume: S.volume });
}
function setRepeat(mode) {
  S.repeat = mode;
  kvPut("settings", { repeat: S.repeat, shuffle: S.shuffle, volume: S.volume });
  renderPlayer();
}
function setShuffle(on) {
  S.shuffle = on;
  kvPut("settings", { repeat: S.repeat, shuffle: S.shuffle, volume: S.volume });
  renderPlayer();
}

function onError() {
  const track = S.queue[S.index];
  if (!track) return;
  if (track.kind === "online" && track.url && !proxiedTried.has(track.key)) {
    proxiedTried.add(track.key);
    pendingPlay = true;
    audio.src = "https://api.allorigins.win/raw?url=" + encodeURIComponent(track.url);
    audio.play().catch(function(){ pendingPlay = false; });
    return;
  }
  failStreak++;
  S.isPlaying = false; S.buffering = false;
  S.error = "پخش ناموفق: " + track.title + " — " + hostOf(track.url || "");
  renderPlayer();
  if (failStreak < Math.min(5, S.queue.length)) setTimeout(() => next(true), 1200);
}

function updateMediaSession(track) {
  if (!("mediaSession" in navigator) || !track) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.artist || "آوا",
      album: track.album || "آوا",
      artwork: [{ src: artworkFor(track), sizes: "512x512", type: "image/png" }],
    });
  } catch (e) {}
}
function updatePositionState() {
  if (!("mediaSession" in navigator)) return;
  try {
    if (isFinite(audio.duration) && "setPositionState" in navigator.mediaSession) {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate,
        position: Math.min(audio.currentTime, audio.duration),
      });
    }
    navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
  } catch (e) {}
}
function bindMediaSession() {
  if (!("mediaSession" in navigator)) return;
  const ms = navigator.mediaSession;
  const set = (action, fn) => { try { ms.setActionHandler(action, fn); } catch (e) {} };
  set("play", () => toggle());
  set("pause", () => toggle());
  set("nexttrack", () => next());
  set("previoustrack", () => prev());
  set("seekbackward", (d) => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  set("seekforward", (d) => { if (isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration - 0.5, audio.currentTime + (d.seekOffset || 10)); });
  set("seekto", (d) => { if (d.seekTime !== undefined) seek(d.seekTime); });
  set("stop", () => audio.pause());
}

/* ---------- downloads ---------- */
async function fetchBlob(url, onProgress) {
  const chain = [
    (u) => u,
    (u) => "/api/proxy?raw=1&url=" + encodeURIComponent(u),
    (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  ];
  for (const make of chain) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 120000);
      const res = await fetch(make(url), { signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) continue;
      const total = Number(res.headers.get("content-length") || 0);
      if (!res.body || (!total && onProgress)) {
        const blob = await res.blob();
        clearTimeout(timer);
        if (blob.size < 1024) continue;
        return blob;
      }
      const reader = res.body.getReader();
      const chunks = []; let loaded = 0;
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        chunks.push(r.value); loaded += r.value.length;
        if (onProgress) onProgress(loaded, total);
      }
      clearTimeout(timer);
      const blob = new Blob(chunks, { type: mimeFromUrl(url) });
      if (blob.size < 1024) continue;
      return blob;
    } catch (e) {}
  }
  return null;
}
async function downloadTrack(track) {
  if (!track.url) return;
  if (S.downloads.some((d) => d.key === track.key)) { showToast("قبلا دانلود شده", "info"); return; }
  showToast("در حال دانلود…", "info");
  const blob = await fetchBlob(track.url, (loaded, total) => {
    if (total > 0) {
      const pct = Math.round((loaded / total) * 100);
      if (pct % 25 === 0) showToast("در حال دانلود… " + toFa(pct) + "٪", "info");
    }
  });
  if (!blob) { showToast("دانلود ناموفق بود — سایت اجازه نداد", "error"); return; }
  await idbPut("blobs", track.key, { key: track.key, blob: blob, mime: blob.type });
  S.downloads = [Object.assign({}, track, { kind: "download" })].concat(S.downloads.filter((d) => d.key !== track.key));
  await kvPut("downloads", S.downloads);
  showToast("دانلود شد — آفلاین پخش میشه", "success");
  renderLibrary(); renderSearch();
}
async function deleteDownload(track) {
  await idbDel("blobs", track.key).catch(function(){});
  S.downloads = S.downloads.filter((d) => d.key !== track.key);
  await kvPut("downloads", S.downloads);
  showToast("دانلود حذف شد", "info");
  renderLibrary(); renderSearch();
}

</script>
<script>
/* Ava single-file app: online scanner, archive.org, radios, UI rendering, boot */
"use strict";

/* ---------- page fetching via proxy chain ---------- */
let HAS_SELF_PROXY = null; // null = unknown, true/false after probe
async function probeSelfProxy() {
  if (HAS_SELF_PROXY !== null) return HAS_SELF_PROXY;
  if (location.protocol !== "http:" && location.protocol !== "https:") { HAS_SELF_PROXY = false; return false; }
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);
    const r = await fetch("/api/proxy?url=" + encodeURIComponent("https://archive.org/robots.txt"), { signal: ctrl.signal });
    clearTimeout(t);
    HAS_SELF_PROXY = r.ok;
  } catch (e) { HAS_SELF_PROXY = false; }
  return HAS_SELF_PROXY;
}

async function timedFetch(url, ms) {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    const res = await fetch(url, { signal: ctrl.signal, redirect: "follow", cache: "no-store" });
    clearTimeout(t);
    return res;
  } catch (e) { return null; }
}

async function fetchPage(url) {
  const hasProxy = await probeSelfProxy();
  const chain = [
    { name: "direct", make: (u) => u },
    { name: "self", make: (u) => "/api/proxy?url=" + encodeURIComponent(u), when: hasProxy },
    { name: "allorigins", make: (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
    { name: "corsproxy", make: (u) => "https://corsproxy.io/?url=" + encodeURIComponent(u) },
    { name: "codetabs", make: (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u) },
    { name: "cors-workers", make: (u) => "https://test.cors.workers.dev/?" + u },
  ];
  for (const hop of chain) {
    if (hop.when === false) continue;
    const res = await timedFetch(hop.make(url), 14000);
    if (!res || !res.ok) continue;
    let text = "";
    try { text = await res.text(); } catch (e) { continue; }
    if (!text || text.length < 400) continue;
    if (!/</.test(text)) continue;
    return { text: text, via: hop.name };
  }
  return null;
}

/* ---------- HTML/RSS extraction ---------- */
const JUNK_LINK_RE = /(login|register|signup|facebook|instagram|twitter|telegram|whatsapp|mailto|javascript:|tel:|#|\.jpg|\.png|\.webp|\.css|\.js)/i;

function extractFromHtml(html, baseUrl, sourceId) {
  const out = { tracks: [], postLinks: [], pageLinks: [], pageTitle: "" };
  let doc;
  try { doc = new DOMParser().parseFromString(html, "text/html"); } catch (e) { return out; }
  out.pageTitle = (doc.querySelector("title") && doc.querySelector("title").textContent.trim()) || "";

  const seen = new Set();
  const audioUrls = [];
  $$("audio", doc).forEach((a) => {
    const src = a.getAttribute("src");
    if (src) audioUrls.push(src);
    $$("source", a).forEach((s) => { const ss = s.getAttribute("src"); if (ss) audioUrls.push(ss); });
  });
  $$("source[src]", doc).forEach((s) => {
    const src = s.getAttribute("src") || "";
    if (AUDIO_EXT_RE.test(src)) audioUrls.push(src);
  });
  $$("a[href]", doc).forEach((a) => {
    const href = a.getAttribute("href") || "";
    if (AUDIO_EXT_RE.test(href)) audioUrls.push(href);
  });
  const rawRe = /["'(=](https?:\\?\/\\?\/[^"'\s()<>]+?\.(?:mp3|m4a|aac|ogg|oga|opus|wav|flac))(?:\?[^"'\s()<>]*)?["')]/gi;
  let m;
  while ((m = rawRe.exec(html)) !== null) audioUrls.push(m[1].replace(/\\\//g, "/"));

  for (const raw of audioUrls) {
    const abs = absUrl(baseUrl, raw.replace(/\\\//g, "/"));
    if (!abs || !AUDIO_EXT_RE.test(abs)) continue;
    if (seen.has(abs)) continue;
    seen.add(abs);
    let text = "";
    // find nearest heading — walk containers is hard without element refs; use filename fallback mostly
    const parsed = parseSiteTitle(text || decodeURIComponent(abs.split("/").pop().split("?")[0] || "") || "بدون عنوان");
    out.tracks.push({
      key: "online:" + hashString(abs),
      kind: "online",
      title: parsed.title,
      artist: parsed.artist || hostOf(baseUrl),
      url: abs,
      pageUrl: baseUrl,
      sourceId: sourceId,
      quality: qualityFromUrl(abs),
      addedAt: Date.now(),
      hue: hashString(abs) % 360,
    });
  }

  const baseHost = hostOf(baseUrl);
  $$("a[href]", doc).forEach((a) => {
    const href = a.getAttribute("href") || "";
    if (!href || JUNK_LINK_RE.test(href)) return;
    const abs = absUrl(baseUrl, href);
    if (!abs || hostOf(abs) !== baseHost) return;
    if (AUDIO_EXT_RE.test(abs)) return;
    const text = (a.textContent || a.getAttribute("title") || "").trim().replace(/\s+/g, " ");
    const isPagey = /[?&](page|p|paged)=/.test(abs) || /\/page\/\d+/.test(abs);
    const isNumericIdy = /[?&](id|post)=\d+/.test(abs) || /\/\d{2,}\/?$/.test(abs) || /\/\d{2,}(\?|$)/.test(abs);
    if (isPagey) out.pageLinks.push(abs);
    else if (isNumericIdy && text) out.postLinks.push({ url: abs, text: text });
    else if (text.length > 8 && /[آ-یa-z]/i.test(text) && (isNumericIdy || abs.includes("?") || abs.split("/").length > 4)) out.postLinks.push({ url: abs, text: text });
  });
  out.postLinks = out.postLinks.filter((l) => l.text.length > 3).slice(0, 120);
  out.pageLinks = Array.from(new Set(out.pageLinks)).slice(0, 30);
  return out;
}

function extractFromRss(xmlText, baseUrl, sourceId) {
  let doc;
  try { doc = new DOMParser().parseFromString(xmlText, "text/xml"); } catch (e) { return []; }
  const items = $$("item, entry", doc);
  const tracks = [];
  const seen = new Set();
  items.forEach((it) => {
    const titleEl = it.querySelector("title");
    const title = (titleEl && titleEl.textContent.trim()) || "بدون عنوان";
    const urls = [];
    $$("enclosure", it).forEach((e) => {
      const u = e.getAttribute("url");
      const t = e.getAttribute("type") || "";
      if (u && (t.indexOf("audio") === 0 || AUDIO_EXT_RE.test(u))) urls.push(u);
    });
    $$("*", it).forEach((el) => {
      if (/media:content/i.test(el.tagName) || /content/i.test(el.tagName)) {
        const u = el.getAttribute("url");
        if (u && (AUDIO_EXT_RE.test(u) || (el.getAttribute("type") || "").indexOf("audio") === 0)) urls.push(u);
      }
    });
    const linkEl = it.querySelector("link");
    const link = (linkEl && linkEl.textContent.trim()) || baseUrl;
    const parsed = parseSiteTitle(title);
    urls.forEach((u) => {
      const abs = absUrl(baseUrl, u);
      if (!abs || seen.has(abs)) return;
      seen.add(abs);
      tracks.push({
        key: "online:" + hashString(abs),
        kind: "online",
        title: parsed.title,
        artist: parsed.artist || hostOf(baseUrl),
        url: abs,
        pageUrl: link,
        sourceId: sourceId,
        addedAt: Date.now(),
        hue: hashString(abs) % 360,
      });
    });
  });
  return tracks;
}

async function scanSite(sourceUrl, sourceId, opts) {
  const maxPages = (opts && opts.maxPages) || 24;
  const onProgress = opts && opts.onProgress;
  const collected = new Map();
  const visited = new Set();
  const queue = [sourceUrl];
  let enqueued = 1;

  while (queue.length > 0 && visited.size < maxPages) {
    if (opts && opts.signal && opts.signal.aborted) break;
    const pageUrl = queue.shift();
    if (visited.has(pageUrl)) continue;
    visited.add(pageUrl);
    if (onProgress) onProgress({ pagesDone: visited.size, pagesTotal: Math.max(enqueued, visited.size + queue.length), found: collected.size });

    const res = await fetchPage(pageUrl);
    if (!res) continue;

    if (isRssUrl(pageUrl) || /<rss|<feed/i.test(res.text.slice(0, 500))) {
      extractFromRss(res.text, pageUrl, sourceId).forEach((t) => { if (t.url) collected.set(t.url, t); });
      continue;
    }
    const extracted = extractFromHtml(res.text, pageUrl, sourceId);
    extracted.tracks.forEach((t) => { if (t.url) collected.set(t.url, t); });
    extracted.postLinks.forEach((pl) => {
      if (visited.has(pl.url) || queue.indexOf(pl.url) >= 0) return;
      if (visited.size + queue.length >= maxPages * 2) return;
      queue.push(pl.url); enqueued++;
    });
    extracted.pageLinks.forEach((pg) => {
      if (visited.has(pg) || queue.indexOf(pg) >= 0) return;
      queue.push(pg); enqueued++;
    });
    if (onProgress) onProgress({ pagesDone: visited.size, pagesTotal: Math.min(Math.max(enqueued, visited.size), maxPages), found: collected.size });
  }
  if (onProgress) onProgress({ pagesDone: visited.size, pagesTotal: visited.size, found: collected.size, message: "پایان اسکن" });
  return Array.from(collected.values());
}

/* ---------- sources management ---------- */
const scanAborts = new Map();

async function saveSources() { await kvPut("sources", S.sources); }
async function saveSourceTracks(id) { await kvPut("sourceTracks:" + id, S.onlineTracks[id] || []); }

async function addSource(urlStr) {
  const url = normalizeUrl(urlStr);
  if (!/^https?:\/\/.+\..+/.test(url)) { showToast("آدرس معتبر نیست", "error"); return null; }
  if (AUDIO_EXT_RE.test(url) || /\.(m3u8|pls|asx)(\?|#|$)/i.test(url) || /(stream|listen|radio|live)\./i.test(url)) return addDirectLink(url);
  if (S.sources.some((s) => s.url === url)) { showToast("این منبع قبلا اضافه شده", "info"); return null; }
  const src = { id: uid("src"), url: url, host: hostOf(url), name: hostOf(url), kind: isRssUrl(url) ? "rss" : "site", trackCount: 0 };
  S.sources.push(src);
  await saveSources();
  renderOnline();
  rescanSource(src.id);
  return src;
}

async function addDirectLink(url) {
  let direct = S.sources.find((s) => s.id === "direct");
  if (!direct) {
    direct = { id: "direct", url: "", host: "", name: "لینک‌های مستقیم", kind: "site", trackCount: 0 };
    S.sources.push(direct);
    await saveSources();
  }
  const prev = S.onlineTracks["direct"] || [];
  if (prev.some((t) => t.url === url)) { showToast("این لینک قبلا اضافه شده", "info"); return direct; }
  const rawName = decodeURIComponent((url.split("/").pop() || "").split("?")[0] || "لینک مستقیم");
  const track = {
    key: "online:" + hashString(url), kind: "online",
    title: rawName.replace(/\.[a-z0-9]+$/i, "") || "لینک مستقیم",
    artist: "لینک مستقیم", url: url, addedAt: Date.now(), hue: hashString(url) % 360,
  };
  S.onlineTracks["direct"] = [track].concat(prev);
  await saveSourceTracks("direct");
  direct.trackCount = S.onlineTracks["direct"].length;
  direct.lastScan = Date.now();
  await saveSources();
  showToast("لینک اضافه شد — پخش مستقیم از منبع", "success");
  renderOnline();
  return direct;
}

async function rescanSource(sourceId, deep) {
  const src = S.sources.find((s) => s.id === sourceId);
  if (!src) return;
  const signal = { aborted: false };
  scanAborts.set(sourceId, signal);
  S.scans[sourceId] = { status: "scanning", pagesDone: 0, pagesTotal: 0, found: 0 };
  renderOnline();

  const setP = (p) => {
    S.scans[sourceId] = { status: "scanning", pagesDone: p.pagesDone, pagesTotal: p.pagesTotal, found: p.found, message: p.message };
    renderOnline();
  };
  let raw = [];
  let error = "";
  if (isRssUrl(src.url)) {
    const res = await fetchPage(src.url);
    if (!res) error = "عدم دسترسی به فید";
    else raw = extractFromRss(res.text, src.url, sourceId);
  } else {
    raw = await scanSite(src.url, sourceId, { maxPages: deep ? 60 : 24, signal: signal, onProgress: setP });
    if (!raw.length) error = "هیچ فایل صوتی پیدا نشد — سایت ممکنه دسترسی اسکنر رو بسته باشه؛ دوباره امتحان کن";
  }

  if (signal.aborted) { delete S.scans[sourceId]; renderOnline(); return; }

  if (!raw.length) {
    S.scans[sourceId] = { status: "error", pagesDone: 0, pagesTotal: 0, found: 0, message: error || "اسکن ناموفق بود" };
    renderOnline();
    return;
  }
  const prev = S.onlineTracks[sourceId] || [];
  const prevByUrl = new Map(prev.map((t) => [t.url, t]));
  const merged = [];
  const seen = new Set();
  raw.forEach((t) => {
    if (!t.url || seen.has(t.url)) return;
    seen.add(t.url);
    const old = prevByUrl.get(t.url);
    merged.push(Object.assign({}, old || {}, t, { key: "online:" + hashString(t.url) }));
  });
  S.onlineTracks[sourceId] = merged;
  await saveSourceTracks(sourceId);
  src.trackCount = merged.length;
  src.lastScan = Date.now();
  await saveSources();
  delete S.scans[sourceId];
  showToast(toFa(merged.length) + " آهنگ از " + src.name, "success");
  renderOnline();
}

async function removeSource(sourceId) {
  const sig = scanAborts.get(sourceId);
  if (sig) sig.aborted = true;
  S.sources = S.sources.filter((s) => s.id !== sourceId);
  delete S.onlineTracks[sourceId];
  await saveSources();
  await kvPut("sourceTracks:" + sourceId, []);
  showToast("منبع حذف شد", "info");
  renderOnline();
}

/* ---------- archive.org ---------- */
const ARCHIVE_PRESETS = [
  { label: "موسیقی ایرانی", q: "persian music" },
  { label: "پادکست فارسی", q: "farsi podcast" },
  { label: "کتاب صوتی", q: "librivox audio" },
  { label: "موسیقی کلاسیک", q: "classical music" },
];
async function searchArchive(query, rows) {
  const q = query + " AND mediatype:(audio)";
  const url = "https://archive.org/advancedsearch.php?q=" + encodeURIComponent(q) +
    "&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&rows=" + (rows || 30) + "&page=1&output=json";
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("search failed");
  const json = await res.json();
  const docs = (json.response && json.response.docs) || [];
  const first = (v) => (Array.isArray(v) ? v[0] || "" : v || "");
  return docs.filter((d) => d.identifier).map((d) => ({ identifier: d.identifier, title: first(d.title) || d.identifier, creator: first(d.creator) || "" }));
}
async function archiveItemTracks(identifier) {
  const res = await fetch("https://archive.org/metadata/" + encodeURIComponent(identifier), { cache: "no-store" });
  if (!res.ok) throw new Error("metadata failed");
  const json = await res.json();
  const first = (v) => (Array.isArray(v) ? v[0] || "" : v || "");
  const album = first(json.metadata && json.metadata.title) || identifier;
  const artist = first(json.metadata && json.metadata.creator) || "آرشیو.org";
  const files = json.files || [];
  const tracks = [];
  files.forEach((f) => {
    if (!/\.(mp3|m4a|ogg|oga|opus|flac|wav)$/i.test(f.name)) return;
    if (/(sample|preview|_512kb)/i.test(f.name)) return;
    const url = "https://archive.org/download/" + encodeURIComponent(identifier) + "/" + encodeURIComponent(f.name);
    let dur;
    if (f.length) dur = f.length.indexOf(":") >= 0
      ? f.length.split(":").reduce((acc, p) => acc * 60 + Number(p || 0), 0)
      : Number(f.length) || undefined;
    tracks.push({
      key: "online:" + hashString(url), kind: "online",
      title: f.title || f.name.replace(/\.[^.]+$/, ""),
      artist: artist, album: album, url: url,
      pageUrl: "https://archive.org/details/" + identifier,
      duration: dur, sourceId: "archive:" + identifier,
      addedAt: Date.now(), hue: hashString(url) % 360,
    });
  });
  return tracks;
}
async function archiveSearch(q) {
  const qq = (q || "").trim();
  if (!qq) return;
  S.archive.q = qq;
  S.archive.phase = "searching"; S.archive.error = "";
  renderOnline();
  try {
    const items = await searchArchive(qq);
    S.archive.items = items;
    S.archive.phase = "items";
    if (!items.length) S.archive.error = "چیزی پیدا نشد — عبارت دیگری امتحان کن";
  } catch (e) {
    S.archive.phase = "items";
    S.archive.error = "جستجو ناموفق بود — اینترنت را چک کن";
  }
  renderOnline();
}
async function archiveOpen(it) {
  S.archive.phase = "loading-tracks"; S.archive.error = "";
  renderOnline();
  try {
    const t = await archiveItemTracks(it.identifier);
    S.archive.tracks = t;
    S.archive.phase = "tracks";
    if (!t.length) S.archive.error = "فایل قابل پخشی در این آیتم نیست";
  } catch (e) {
    S.archive.phase = "items";
    S.archive.error = "دریافت فهرست فایل‌ها ناموفق بود";
  }
  renderOnline();
}

/* ---------- import files ---------- */
async function importFromFiles(fileList) {
  const raw = Array.from(fileList || []);
  const files = raw.filter((f) => f && (AUDIO_EXT_RE.test(f.name) || (f.type && f.type.indexOf("audio/") === 0)));
  if (!files.length) { showToast("هیچ فایل صوتی‌ای انتخاب نشد", "error"); return; }
  S.importing = { total: files.length, done: 0 };
  renderLibrary();
  const existing = new Set(S.localTracks.map((t) => t.key));
  const added = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const key = "local:" + f.name + ":" + f.size;
    try {
      if (!existing.has(key)) {
        await idbPut("files", key, { key: key, name: key, file: f });
        const p = parseFileName(f.name);
        added.push({ key: key, kind: "local", title: p.title, artist: p.artist, fileName: key, size: f.size, addedAt: Date.now() + i, hue: hashString(key) % 360 });
      }
    } catch (e) {}
    S.importing = { total: files.length, done: i + 1 };
    if (i % 5 === 0 || i === files.length - 1) renderLibrary();
  }
  S.localTracks = added.concat(S.localTracks);
  await kvPut("localTracks", S.localTracks);
  S.importing = null;
  renderLibrary(); renderSearch();
  if (added.length) { showToast(toFa(added.length) + " فایل به کتابخانه اضافه شد", "success"); probeDurations(added); }
  else showToast("این فایل‌ها قبلا اضافه شده بودن", "info");
}
function probeDurations(tracks) {
  let idx = 0, active = 0;
  let saveTimer = null;
  const saveThrottled = () => {
    if (saveTimer) return;
    saveTimer = setTimeout(() => { saveTimer = null; kvPut("localTracks", S.localTracks); }, 1500);
  };
  const runNext = () => {
    while (active < 2 && idx < tracks.length) {
      const t = tracks[idx++];
      if (t.duration) continue;
      active++;
      (async () => {
        try {
          const rec = await idbGet("files", t.fileName || t.key);
          if (rec && rec.file) {
            const url = URL.createObjectURL(rec.file);
            await new Promise((resolve) => {
              const a = new Audio();
              a.preload = "metadata";
              const done = () => { a.src = ""; resolve(); };
              a.addEventListener("loadedmetadata", () => {
                if (isFinite(a.duration)) {
                  const tt = S.localTracks.find((x) => x.key === t.key);
                  if (tt) tt.duration = a.duration;
                  saveThrottled();
                }
                done();
              });
              a.addEventListener("error", done);
              setTimeout(done, 10000);
              a.src = url;
            });
            URL.revokeObjectURL(url);
          }
        } catch (e) {}
        active--;
        runNext();
      })();
    }
  };
  runNext();
}

/* ---------- sliders (seek + volume) ---------- */
function attachSlider(el, get, commit) {
  const fill = $(".sl-fill", el), thumb = $(".sl-thumb", el);
  const setFromX = (clientX) => {
    const rect = el.getBoundingClientRect();
    if (!rect.width) return 0;
    return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  };
  let dragging = false;
  el.addEventListener("pointerdown", (e) => {
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const v = setFromX(e.clientX);
    if (fill) fill.style.width = v * 100 + "%";
    if (thumb) thumb.style.left = v * 100 + "%";
  });
  el.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const v = setFromX(e.clientX);
    if (fill) fill.style.width = v * 100 + "%";
    if (thumb) thumb.style.left = v * 100 + "%";
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    commit(setFromX(e.clientX) * get());
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", () => { dragging = false; });
}

/* ---------- hold buttons (prev/next) ---------- */
const HOLD_MS = 420;
function attachHold(btn, onHold, onTap) {
  let timer = null, held = false, consumed = false;
  btn.addEventListener("pointerdown", () => {
    held = false;
    timer = setTimeout(() => { held = true; onHold(); }, HOLD_MS);
  });
  btn.addEventListener("pointerup", () => {
    if (timer) clearTimeout(timer);
    timer = null;
    if (!held) onTap();
    consumed = true;
    held = false;
  });
  btn.addEventListener("pointerleave", () => { if (timer) clearTimeout(timer); timer = null; });
  btn.addEventListener("click", (e) => {
    if (consumed) { consumed = false; e.stopImmediatePropagation(); }
  });
}

/* ---------- swipe down to close sheet + swipe left/right artwork ---------- */
function attachGestures() {
  const sheet = $("#sheet");
  let startY = null;
  sheet.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
  }, { passive: true });
  sheet.addEventListener("touchend", (e) => {
    if (startY === null) return;
    const dy = e.changedTouches[0].clientY - startY;
    startY = null;
    if (dy > 110) { sheet.classList.remove("open"); renderMini(); }
  }, { passive: true });

  const art = $("#sheet-art");
  let startX = null;
  art.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; }, { passive: true });
  art.addEventListener("touchend", (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (dx < -70) next();
    else if (dx > 70) prev();
  }, { passive: true });
}

/* ---------- global click delegation ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act],[data-tab],[data-seg],[data-theme],[data-play],[data-menu],[data-radio],[data-radio-play],[data-expand],[data-play-src],[data-del-src],[data-rescan],[data-rescan-deep],[data-arch-q],[data-arch-open],[data-src-open]");
  if (!el) return;

  if (el.hasAttribute("data-tab")) { setTab(el.getAttribute("data-tab")); return; }
  if (el.hasAttribute("data-seg")) { S.seg = el.getAttribute("data-seg"); renderOnline(); return; }
  if (el.hasAttribute("data-theme")) { setThemeChoice(el.getAttribute("data-theme")); return; }

  const listId = el.getAttribute("data-play");
  if (listId) {
    const rr = findTrackAndList(el.getAttribute("data-key"), listId);
    if (rr.track && rr.idx >= 0) playQueue(rr.list, rr.idx);
    return;
  }
  const menuKey = el.getAttribute("data-menu");
  if (menuKey) {
    const rr = findTrackAndList(menuKey, el.getAttribute("data-list"));
    if (rr.track) S.menuTrack = rr.track;
    renderMenu();
    return;
  }
  const radioId = el.getAttribute("data-radio-play");
  if (radioId) {
    const st = RADIOS.find((r) => r.id === radioId);
    if (st) {
      const active = S.queue[S.index] && S.queue[S.index].key === "radio:" + st.id;
      if (active) toggle();
      else playQueue([radioTrack(st)], 0);
    }
    return;
  }
  if (el.hasAttribute("data-radio")) {
    const st = RADIOS.find((r) => r.id === el.getAttribute("data-radio"));
    if (st) playQueue([radioTrack(st)], 0);
    return;
  }
  if (el.hasAttribute("data-expand")) {
    const id = el.getAttribute("data-expand");
    S.expandedSource = S.expandedSource === id ? null : id;
    renderOnline();
    return;
  }
  if (el.hasAttribute("data-play-src")) {
    const id = el.getAttribute("data-play-src");
    const tracks = S.onlineTracks[id] || [];
    if (tracks.length) playQueue(tracks, 0);
    return;
  }
  if (el.hasAttribute("data-del-src")) { removeSource(el.getAttribute("data-del-src")); return; }
  if (el.hasAttribute("data-rescan")) { rescanSource(el.getAttribute("data-rescan")); return; }
  if (el.hasAttribute("data-rescan-deep")) { rescanSource(el.getAttribute("data-rescan-deep"), true); return; }
  if (el.hasAttribute("data-arch-q")) { archiveSearch(el.getAttribute("data-arch-q")); return; }
  if (el.hasAttribute("data-arch-open")) {
    const id = el.getAttribute("data-arch-open");
    const it = S.archive.items.find((x) => x.identifier === id);
    if (it) archiveOpen(it);
    return;
  }

  const act = el.getAttribute("data-act");
  switch (act) {
    case "toggle": toggle(); break;
    case "next": next(); break;
    case "pick-dir": $("#dir-input").click(); break;
    case "pick-files": $("#file-input").click(); break;
    case "play-all": {
      const list = S.downloads.concat(S.localTracks);
      setShuffle(false);
      if (list.length) playQueue(list, 0);
      break;
    }
    case "play-shuffle": {
      const list2 = S.downloads.concat(S.localTracks);
      setShuffle(true);
      if (list2.length) playQueue(list2, Math.floor(Math.random() * list2.length));
      break;
    }
    case "clear-search": S.searchQ = ""; renderSearch(); break;
    case "archive-clear": S.archive = { phase: "idle", q: "", items: [], tracks: [], error: "" }; renderOnline(); break;
    case "arch-back": S.archive.phase = "items"; renderOnline(); break;
    case "arch-play-all": if (S.archive.tracks.length) playQueue(S.archive.tracks, 0); break;
    case "add-source": {
      const inp = $("#src-input");
      if (inp && inp.value.trim()) { addSource(inp.value.trim()); inp.value = ""; }
      break;
    }
    case "install":
      if (S.installEvt) S.installEvt.prompt().catch(function(){});
      break;
    case "persist":
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then((ok) => showToast(ok ? "حافظه دائمی فعال شد" : "مرورگر اجازه نداد", ok ? "success" : "error")).then(updateUsage);
      break;
    case "wipe":
      if (confirm("مطمئنی؟ همه‌ی داده‌های اپ پاک میشه.")) {
        indexedDB.deleteDatabase(DB_NAME);
        localStorage.clear();
        location.reload();
      }
      break;
    case "close-menu": S.menuTrack = null; renderMenu(); break;
    case "m-play": if (S.menuTrack) { playQueue([S.menuTrack], 0); S.menuTrack = null; renderMenu(); } break;
    case "m-next": if (S.menuTrack) { insertAfterCurrent(S.menuTrack); S.menuTrack = null; renderMenu(); showToast("بعد از آهنگ فعلی پخش میشه", "info"); } break;
    case "m-queue": if (S.menuTrack) { appendToQueue(S.menuTrack); S.menuTrack = null; renderMenu(); showToast("به صف اضافه شد", "info"); } break;
    case "m-dl": if (S.menuTrack) { const tt = S.menuTrack; S.menuTrack = null; renderMenu(); downloadTrack(tt); } break;
    case "m-undl": if (S.menuTrack) { deleteDownload(S.menuTrack); S.menuTrack = null; renderMenu(); } break;
    case "m-del": {
      if (S.menuTrack) {
        const t = S.menuTrack;
        S.menuTrack = null; renderMenu();
        idbDel("files", t.key).catch(function(){});
        S.localTracks = S.localTracks.filter((x) => x.key !== t.key);
        kvPut("localTracks", S.localTracks);
        showToast("از کتابخانه حذف شد", "info");
        renderLibrary(); renderSearch();
      }
      break;
    }
    case "m-open": if (S.menuTrack) window.open(S.menuTrack.pageUrl || S.menuTrack.url, "_blank"); break;
  }
});

/* menu backdrop click */
$("#menubackdrop").addEventListener("click", () => { S.menuTrack = null; renderMenu(); });
/* mini player opens sheet */
$("#mini").addEventListener("click", (e) => {
  if (e.target.closest("[data-act]")) return;
  $("#sheet").classList.add("open");
  renderMini();
});
$("#sheet-close").addEventListener("click", () => { $("#sheet").classList.remove("open"); renderMini(); });

/* long-press on rows → menu */
let rowHoldTimer = null, rowHeld = false;
document.addEventListener("pointerdown", (e) => {
  const row = e.target.closest(".trow");
  if (!row || e.target.closest("[data-menu]")) return;
  rowHeld = false;
  const key = row.getAttribute("data-key");
  const listId = row.getAttribute("data-play");
  rowHoldTimer = setTimeout(() => {
    rowHeld = true;
    const rr = findTrackAndList(key, listId);
    if (rr.track) { S.menuTrack = rr.track; renderMenu(); }
  }, 430);
}, { passive: true });
document.addEventListener("pointerup", () => { if (rowHoldTimer) clearTimeout(rowHoldTimer); rowHoldTimer = null; });
document.addEventListener("pointercancel", () => { if (rowHoldTimer) clearTimeout(rowHoldTimer); rowHoldTimer = null; });
document.addEventListener("click", (e) => {
  if (rowHeld) { rowHeld = false; e.stopPropagation(); e.preventDefault(); }
}, true);

/* ---------- boot ---------- */
async function boot() {
  bindMediaSession();
  try {
    const st = (await kvGet("settings")) || {};
    S.repeat = st.repeat || "all";
    S.shuffle = !!st.shuffle;
    S.volume = st.volume == null ? 1 : st.volume;
    audio.volume = S.volume;
  } catch (e) {}
  try {
    const saved = await kvGet("queue");
    if (saved && saved.queue && saved.queue.length) {
      S.queue = saved.queue;
      S.index = Math.min(saved.index || 0, saved.queue.length - 1);
    }
  } catch (e) {}
  try {
    S.localTracks = (await kvGet("localTracks")) || [];
    S.downloads = (await kvGet("downloads")) || [];
    let sources = await kvGet("sources");
    if (sources === undefined || sources === null) {
      sources = [{ id: "src_musicdel", url: "https://musicdel.ir", host: "musicdel.ir", name: "موزیک‌دل", kind: "site", trackCount: 0 }];
      await kvPut("sources", sources);
      setTimeout(() => rescanSource("src_musicdel"), 1500);
    }
    S.sources = sources;
    for (const src of sources) {
      S.onlineTracks[src.id] = (await kvGet("sourceTracks:" + src.id)) || [];
    }
  } catch (e) {}

  applyTheme(getThemeChoice());
  setTab("library");
  renderMini(); renderPlayer();

  attachSlider($("#seek"), () => S.duration || (S.queue[S.index] && S.queue[S.index].duration) || 0, (v) => seek(v));
  attachSlider($("#vol"), () => 1, (v) => setVolume(Math.max(0, Math.min(1, v))));
  attachHold($("#btn-prev"), () => prevHold(), () => prev());
  attachHold($("#btn-next"), () => seekForward30(), () => next());
  attachGestures();

  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    S.installEvt = e;
    if (S.tab === "settings") renderSettings();
  });
}
boot();

</script>
<script>
/* sheet menu button + repeat/shuffle wiring (after UI js) */
(function(){
  $("#sheet-menu").addEventListener("click", () => {
    const t = S.queue[S.index];
    if (t) { S.menuTrack = t; renderMenu(); }
  });
  $("#btn-repeat").addEventListener("click", () => {
    setRepeat(S.repeat === "off" ? "all" : S.repeat === "all" ? "one" : "off");
  });
  $("#btn-shuffle").addEventListener("click", () => setShuffle(!S.shuffle));
  $("#file-input").addEventListener("change", function(){ importFromFiles(this.files); this.value = ""; });
  $("#dir-input").addEventListener("change", function(){ importFromFiles(this.files); this.value = ""; });
})();
</script>
